name: Build and Deploy Corporate Carpool System

# 1. Điều kiện kích hoạt: Khi code được merge hoặc push vào nhánh main
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo (checkout) mã nguồn từ Repo về server của GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Thiết lập môi trường Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 3: Đăng nhập vào Docker Hub (Sử dụng Secret để bảo mật password)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Bước 4: Build & Push Docker image cho Backend (.NET)
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/backend/Dockerfile
          push: true
          tags: your-dockerhub-username/carpool-backend:latest

      # Bước 5: SSH vào Server VPS để kéo Docker image mới nhất về và chạy (Deploy)
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /app/carpool
            git pull origin main
            docker-compose down
            docker-compose up -d --build